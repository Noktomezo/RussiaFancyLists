name: Geoblock Recon Update (Daily)

on:
  schedule:
    # Run once daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  recon-geoblock:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Run update script with subdomain recon
      run: |
        uv run russiafancylists --force-recon

    - name: Verify hosts lists sync
      run: |
        uv run python scripts/verify_hosts_sync.py

    - name: Check for changes in lists or data directory
      id: check_changes
      run: |
        if git diff --quiet .; then
          echo "No changes detected"
          echo "has_changes=false" >> $GITHUB_OUTPUT
        else
          echo "Changes detected"
          echo "has_changes=true" >> $GITHUB_OUTPUT
        fi

    - name: Commit and push changes
      if: steps.check_changes.outputs.has_changes == 'true'
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

        git add -A
        git commit -m "chore: daily geoblock subdomain recon $(date +'%Y-%m-%d')

        Updated subdomains cache and geoblock lists from crt.name."

        git push

    - name: Log completion
      if: steps.check_changes.outputs.has_changes == 'true'
      run: |
        echo "✅ Subdomains recon completed and pushed successfully"

    - name: Log no changes
      if: steps.check_changes.outputs.has_changes == 'false'
      run: |
        echo "ℹ️ No changes detected, skipping commit"
